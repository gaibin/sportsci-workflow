[project]
name = "sportsci-topic"
version = "1.0.0"
description = "Topic selection and study planning for sport, exercise and health science students: evidence map, design, sample size and a visible feasibility rubric"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["sport science", "exercise science", "topic selection", "study design", "sample size", "power analysis", "thesis", "literature gap"]
dependencies = [
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
refs = ["sportsci-refs>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
sportsci-topic = "sportsci_topic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sportsci_topic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
