[project]
name = "sportsci-refs"
version = "1.0.0"
description = "Literature search, DOI verification, GB/T 7714 and live Zotero citation fields in Word: build, edit and verify thesis references safely"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["zotero", "citation", "word", "docx", "gb/t 7714", "references", "thesis", "crossref", "doi"]
dependencies = [
    "lxml>=5.0",
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "python-docx>=1.1", "matplotlib>=3.8"]

[project.scripts]
sportsci-refs = "sportsci_refs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sportsci_refs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
