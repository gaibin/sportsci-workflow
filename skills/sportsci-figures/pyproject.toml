[project]
name = "sportsci-figures"
version = "1.0.0"
description = "Publication-grade figures, three-line tables and Results documents for sport, exercise and health science, in Chinese or English"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["sport science", "exercise science", "statistics", "matplotlib", "figures", "tables", "results", "thesis", "pubstyle"]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pingouin>=0.5.4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
sportsci-figures = "sportsci_figures.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sportsci_figures"]

[tool.hatch.build.targets.wheel.force-include]
"config/design_templates" = "sportsci_figures/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
